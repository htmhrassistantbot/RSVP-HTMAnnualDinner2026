
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTM Grand Annual Dinner - Guest Check-In</title>

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --dark-bg: #0d0f12;
      --panel-bg: rgba(22, 26, 33, 0.95);
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      text-align: center;
      color: #ffffff;
      padding: 20px 15px;
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-color: var(--dark-bg);
    }

    .bg-slide {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .bg-slide.active {
      opacity: 1;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(
        rgba(13, 15, 18, 0.82),
        rgba(13, 15, 18, 0.82)
      );
      pointer-events: none;
    }

    h2 {
      color: var(--gold-light);
      margin-top: 10px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 20px;
      font-weight: 300;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .subtitle {
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      color: #8a94a6;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      border-radius: 8px;
      padding: 6px;
      background: linear-gradient(
        135deg,
        var(--gold-dark),
        var(--gold-light),
        var(--gold-dark)
      );
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #reader {
      width: 100% !important;
      background: #000000 !important;
      border-radius: 4px;
      overflow: hidden;
    }

    /* Back camera: normal direction */
    #reader video {
      transform: none !important;
      -webkit-transform: none !important;
    }

    /* Front camera: mirrored direction */
    #reader video.front-camera {
      transform: scaleX(-1) !important;
      -webkit-transform: scaleX(-1) !important;
    }

    #reader a,
    #reader button {
      font-family: 'Segoe UI', sans-serif;
      color: #000000 !important;
      border: none !important;
      background: linear-gradient(
        to bottom,
        var(--gold-light),
        var(--gold-primary)
      ) !important;
      padding: 10px 20px !important;
      border-radius: 4px !important;
      text-transform: uppercase !important;
      font-size: 11px !important;
      font-weight: bold !important;
      letter-spacing: 1.5px !important;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin: 10px 0 !important;
    }

    .laser-line {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 4px;
      background: linear-gradient(
        90deg,
        rgba(212,175,55,0) 0%,
        rgba(243,229,171,1) 50%,
        rgba(212,175,55,0) 100%
      );
      box-shadow: 0 0 15px 3px var(--gold-primary);
      z-index: 5;
      top: 6px;
      pointer-events: none;
      animation: goldShimmer 3.5s ease-in-out infinite;
    }

    @keyframes goldShimmer {
      0% { top: 6px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        top: calc(100% - 10px);
        opacity: 0;
      }
    }

    #result {
      margin: 30px auto 0 auto;
      max-width: 340px;
      padding: 30px 25px;
      border-radius: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--gold-primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      display: none;
    }

    .animate-entrance {
      animation: formalEntrance 0.7s cubic-bezier(0.19, 1, 0.22, 1) both;
    }

    @keyframes formalEntrance {
      0% {
        transform: translateY(30px) scale(0.96);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .success-header {
      color: var(--gold-light);
      font-size: 16px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    .gold-divider {
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold-primary),
        transparent
      );
      margin: 15px 0;
    }

    .data-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
    }

    .data-label {
      font-family: 'Segoe UI', sans-serif;
      color: #718096;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .data-value {
      font-size: 18px;
      color: #ffffff;
    }

    .table-badge {
      margin-top: 20px;
      padding: 14px;
      border: 1px dashed var(--gold-primary);
      border-radius: 8px;
      background: rgba(212, 175, 55, 0.08);
    }

    .table-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 10px;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .table-number {
      font-size: 26px;
      font-weight: bold;
      color: var(--gold-light);
      letter-spacing: 1.5px;
    }

    .lucky-badge {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid var(--gold-primary);
      border-radius: 8px;
      background: linear-gradient(
        135deg,
        rgba(212, 175, 55, 0.15),
        rgba(13, 15, 18, 0.6)
      );
    }

    .lucky-number {
      font-size: 22px;
      font-weight: bold;
      color: var(--gold-light);
      letter-spacing: 2px;
    }

    .hud-text {
      font-family: 'Segoe UI', sans-serif;
      font-size: 10px;
      color: #4a5568;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 12px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>

<body>

  <!-- BACKGROUND MUSIC -->
  <audio id="bgMusic" loop>
    <source src="Hotel Music.mp3" type="audio/mpeg">
  </audio>

  <!-- BACKGROUND SLIDESHOW -->
  <div id="slide1" class="bg-slide active"></div>
  <div id="slide2" class="bg-slide"></div>
  <div class="bg-overlay"></div>

  <h2>HTM Annual Dinner 2026</h2>
  <div class="subtitle">Guest Welcoming Portal</div>

  <div class="scanner-container">
    <div class="laser-line"></div>
    <div id="reader"></div>
  </div>

  <div class="hud-text">Digital Concierge Active</div>

  <!-- MUSIC BUTTON -->
  <div>
    <button
      onclick="toggleMusic()"
      style="
        margin: 10px auto;
        padding: 6px 14px;
        font-size: 9px;
        font-family: 'Segoe UI', sans-serif;
        background: rgba(212,175,55,0.15);
        border: 1px solid var(--gold-primary);
        color: var(--gold-light);
        border-radius: 4px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
      "
    >🎵 Toggle Music</button>
  </div>

  <div id="result"></div>

  <script>
    // ==========================================
    // BACKGROUND SLIDESHOW
    // ==========================================

    var wallpaperList = [
      "bg1.jpeg",
      "bg2.jpeg",
      "bg3.jpeg",
      "bg4.jpeg"
    ];

    var currentBgIndex = 0;
    var activeSlide = 1;

    function rotateWallpapers() {
      if (wallpaperList.length <= 1) return;

      var nextIndex = (currentBgIndex + 1) % wallpaperList.length;

      var currentSlideEl = document.getElementById(
        activeSlide === 1 ? "slide1" : "slide2"
      );

      var nextSlideEl = document.getElementById(
        activeSlide === 1 ? "slide2" : "slide1"
      );

      nextSlideEl.style.backgroundImage =
        "url('" + wallpaperList[nextIndex] + "')";

      nextSlideEl.classList.add("active");
      currentSlideEl.classList.remove("active");

      activeSlide = activeSlide === 1 ? 2 : 1;
      currentBgIndex = nextIndex;
    }

    function initSlideshow() {
      if (wallpaperList.length > 0) {
        document.getElementById("slide1").style.backgroundImage =
          "url('" + wallpaperList[0] + "')";

        setInterval(rotateWallpapers, 6000);
      }
    }


    // ==========================================
    // SCANNER VARIABLES
    // ==========================================

    var html5QrcodeScanner;
    var isProcessing = false;

    // AUTO FOCUS AND AUTO ZOOM
    var autoZoomTimer = null;
    var autoZoomBusy = false;
    var currentZoom = 1;
    var lastZoomTime = 0;
    var qrDetector = null;

    var GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzyOEtXFeEhNcqat7VzlpLR71eJ-XKSsTXgDzRZ9Z85RZXWt-sujmopjBCYq83CheMoEQ/exec";


    // ==========================================
    // VOICE ANNOUNCEMENT
    // ==========================================

    var availableVoices = [];

    function populateVoiceList() {
      if ("speechSynthesis" in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }

    if ("speechSynthesis" in window) {
      populateVoiceList();

      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
      }
    }

    function speakPersonalizedWelcome(name, table) {
      try {
        if (!("speechSynthesis" in window)) return;

        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
        }

        var customSpeechText =
          "Welcome. Your table assignment is " +
          table +
          ". Please enjoy the Annual Dinner.";

        var utterance =
          new SpeechSynthesisUtterance(customSpeechText);

        if (availableVoices.length === 0) {
          availableVoices = window.speechSynthesis.getVoices();
        }

        var selectedVoice = availableVoices.find(function(v) {
          return (
            v.name.includes("Premium") ||
            v.name.includes("Natural") ||
            v.name.includes("Google US English") ||
            v.name.includes("Samantha") ||
            v.name.includes("Aria")
          );
        }) || availableVoices.find(function(v) {
          return v.lang && v.lang.startsWith("en");
        });

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.rate = 0.95;
        utterance.pitch = 1.0;

        setTimeout(function() {
          window.speechSynthesis.speak(utterance);
        }, 300);

      } catch (e) {
        console.error("Speech processing error:", e);
      }
    }


    // ==========================================
    // AUDIO CONTROLS
    // ==========================================

    function unlockAudioEngine() {
      var music = document.getElementById("bgMusic");

      if (music && music.paused) {
        music.volume = 0.4;

        music.play().catch(function(e) {
          console.log("Audio autoplay restricted:", e);
        });
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();

        var dummyUtterance =
          new SpeechSynthesisUtterance("");

        dummyUtterance.volume = 0.01;
        window.speechSynthesis.speak(dummyUtterance);
      }
    }

    function toggleMusic() {
      var music = document.getElementById("bgMusic");

      if (music.paused) {
        music.play().catch(function(e) {
          console.log("Music playback error:", e);
        });
      } else {
        music.pause();
      }
    }


    // ==========================================
    // QR CODE DATA PROCESSING
    // ==========================================

    function parseQrPayload(text) {
      var extractedId = text;
      var extractedTable = null;

      if (text.includes("|")) {
        var segments = text.split("|");

        segments.forEach(function(segment) {
          var parts = segment.split(":");

          if (parts.length >= 2) {
            var key = parts[0].trim().toUpperCase();
            var val = parts.slice(1).join(":").trim();

            if (key === "ID") extractedId = val;
            if (key === "TABLE") extractedTable = val;
          }
        });

      } else if (text.includes(":")) {
        var parts = text.split(":");
        extractedId = parts[parts.length - 1].trim();
      }

      return {
        id: extractedId,
        table: extractedTable
      };
    }


    // ==========================================
    // CAMERA DIRECTION
    // ==========================================

    function setCameraDisplayDirection() {
      var video = document.querySelector("#reader video");

      if (!video || !video.srcObject) return;

      var track = video.srcObject.getVideoTracks()[0];

      if (!track) return;

      var settings = {};

      try {
        settings = track.getSettings();
      } catch (error) {
        console.log("Unable to read camera settings:", error);
      }

      var facingMode = settings.facingMode || "";

      // Mirror only when browser identifies the front camera.
      if (facingMode === "user") {
        video.classList.add("front-camera");
      } else {
        // Back camera remains normal.
        video.classList.remove("front-camera");
      }
    }


    // ==========================================
    // STOP AUTO FOCUS / AUTO ZOOM
    // ==========================================

    function stopAutoZoom() {
      if (autoZoomTimer) {
        clearInterval(autoZoomTimer);
        autoZoomTimer = null;
      }

      autoZoomBusy = false;
    }


    // ==========================================
    // AUTO FOCUS AND AUTO ZOOM
    // ==========================================

    function startAutoFocusAndZoom() {
      stopAutoZoom();

      // BarcodeDetector is not available in every browser.
      // Autofocus can still be requested even without it.
      qrDetector = null;

      if ("BarcodeDetector" in window) {
        try {
          qrDetector = new BarcodeDetector({
            formats: ["qr_code"]
          });
        } catch (error) {
          console.log("QR detector unavailable:", error);
        }
      } else {
        console.log(
          "BarcodeDetector is not supported. Automatic QR-based zoom is unavailable."
        );
      }

      autoZoomTimer = setInterval(async function() {

        if (autoZoomBusy || isProcessing) return;

        var video = document.querySelector("#reader video");

        if (
          !video ||
          !video.srcObject ||
          !video.videoWidth
        ) {
          return;
        }

        var track = video.srcObject.getVideoTracks()[0];

        if (!track) return;

        autoZoomBusy = true;

        try {
          // Read camera capabilities safely.
          var capabilities = {};
          var settings = {};

          if (typeof track.getCapabilities === "function") {
            capabilities = track.getCapabilities();
          }

          if (typeof track.getSettings === "function") {
            settings = track.getSettings();
          }

          // --------------------------------------
          // CONTINUOUS AUTOFOCUS
          // --------------------------------------

          if (
            capabilities.focusMode &&
            capabilities.focusMode.includes("continuous") &&
            !track.__autoFocusEnabled
          ) {
            try {
              await track.applyConstraints({
                advanced: [
                  { focusMode: "continuous" }
                ]
              });

              track.__autoFocusEnabled = true;

              console.log("Continuous autofocus enabled.");

            } catch (focusError) {
              console.log(
                "Continuous autofocus is unavailable:",
                focusError
              );
            }
          }

          // --------------------------------------
          // QR DETECTION
          // --------------------------------------

          if (!qrDetector) return;

          var detectedCodes = await qrDetector.detect(video);

          if (
            !detectedCodes ||
            detectedCodes.length === 0
          ) {
            return;
          }

          // --------------------------------------
          // CHECK HARDWARE ZOOM SUPPORT
          // --------------------------------------

          if (
            !capabilities.zoom ||
            typeof track.applyConstraints !== "function"
          ) {
            return;
          }

          var minZoom = capabilities.zoom.min;
          var maxZoom = capabilities.zoom.max;
          var zoomStep = capabilities.zoom.step || 0.1;

          currentZoom =
            settings.zoom !== undefined
              ? settings.zoom
              : minZoom;

          // --------------------------------------
          // SELECT LARGEST DETECTED QR CODE
          // --------------------------------------

          var qr = detectedCodes.reduce(function(previous, current) {
            var previousArea =
              previous.boundingBox.width *
              previous.boundingBox.height;

            var currentArea =
              current.boundingBox.width *
              current.boundingBox.height;

            return currentArea > previousArea
              ? current
              : previous;
          });

          var qrWidth = qr.boundingBox.width;
          var videoWidth = video.videoWidth;

          // Target QR size: approximately 38% of video width.
          var targetWidth = videoWidth * 0.38;

          var newZoom = currentZoom;

          // QR code is small: zoom in gradually.
          if (qrWidth < targetWidth * 0.75) {
            newZoom = Math.min(
              maxZoom,
              currentZoom + Math.max(zoomStep, 0.2)
            );

          // QR code is too large: zoom out gradually.
          } else if (qrWidth > targetWidth * 1.35) {
            newZoom = Math.max(
              minZoom,
              currentZoom - Math.max(zoomStep, 0.2)
            );
          }

          // --------------------------------------
          // APPLY ZOOM
          // --------------------------------------

          if (
            Math.abs(newZoom - currentZoom) >= zoomStep / 2 &&
            Date.now() - lastZoomTime > 700
          ) {
            lastZoomTime = Date.now();

            await track.applyConstraints({
              advanced: [
                { zoom: newZoom }
              ]
            });

            currentZoom = newZoom;

            console.log("Camera zoom adjusted:", newZoom);
          }

        } catch (error) {
          console.log(
            "Auto-focus / auto-zoom adjustment:",
            error
          );

        } finally {
          autoZoomBusy = false;
        }

      }, 500);
    }


    // ==========================================
    // SUCCESSFUL QR SCAN
    // ==========================================

    function onScanSuccess(decodedText, decodedResult) {

      if (isProcessing) return;

      isProcessing = true;

      // Stop auto zoom after successful QR detection.
      stopAutoZoom();

      var resultDiv = document.getElementById("result");

      resultDiv.classList.remove("animate-entrance");
      resultDiv.style.display = "block";

      resultDiv.innerHTML =
        '<div class="success-header" style="color:#a0aec0; letter-spacing:2px;">Verifying Invitation...</div>';

      var rawText = decodedText.trim();

      var parsedData = parseQrPayload(rawText);

      var staffId = parsedData.id;
      var qrTable = parsedData.table;

      var scriptId = "google_jsonp_bridge";

      var oldScript = document.getElementById(scriptId);

      if (oldScript) {
        oldScript.parentNode.removeChild(oldScript);
      }

      window.handleGoogleResponse = function(responseString) {

        html5QrcodeScanner.clear().then(function() {

          var parts = responseString.split("|");

          if (parts[0] === "SUCCESS") {

            var displayName = parts[1];
            var calculatedTable =
              qrTable || parts[2] || "UNASSIGNED";

            var displayOutlet = parts[3] || "-";
            var luckyDrawNo = parts[4] || "-";

            resultDiv.classList.add("animate-entrance");

            resultDiv.innerHTML =

              '<div class="success-header">✨ Welcome ✨</div>' +

              '<div class="data-row">' +
                '<div class="data-label">Guest Name</div>' +
                '<div class="data-value" style="color:var(--gold-light); font-weight:bold;">' +
                  displayName +
                '</div>' +
              '</div>' +

              '<div class="gold-divider"></div>' +

              '<div class="data-row">' +
                '<div class="data-label">Outlet</div>' +
                '<div class="data-value" style="color:#ffffff;">' +
                  displayOutlet +
                '</div>' +
              '</div>' +

              '<div class="gold-divider"></div>' +

              '<div class="data-row">' +
                '<div class="data-label">Guest Code</div>' +
                '<div class="data-value" style="font-size:14px; font-family:monospace;">' +
                  staffId +
                '</div>' +
              '</div>' +

              '<div class="table-badge">' +
                '<div class="table-title">Table Assignment</div>' +
                '<div class="table-number">' +
                  calculatedTable.toUpperCase() +
                '</div>' +
              '</div>' +

              '<div class="lucky-badge">' +
                '<div class="table-title">Lucky Draw No.</div>' +
                '<div class="lucky-number">🎟️ ' +
                  luckyDrawNo +
                '</div>' +
              '</div>';

            speakPersonalizedWelcome(
              displayName,
              calculatedTable
            );

            resetScanner(7000);

          } else {

            resultDiv.innerHTML =
              "<h3 style='color:#fc8181;'>Invitation Unrecognized</h3>" +
              "<p style='font-size:13px;'>ID " +
              staffId +
              " is not registered on the seating charts.</p>";

            resetScanner(4000);
          }

        }).catch(function(err) {

          console.error("Camera reset issue:", err);

          isProcessing = false;
        });
      };


      // Send guest ID to Google Apps Script.
      var jsonpUrl =
        GOOGLE_SCRIPT_URL +
        "?id=" +
        encodeURIComponent(staffId) +
        "&callback=handleGoogleResponse";

      var script = document.createElement("script");

      script.id = scriptId;
      script.src = jsonpUrl;

      script.onerror = function() {

        resultDiv.innerHTML =
          "<h3 style='color:#fc8181;'>Connection Timeout</h3>" +
          "<p style='font-size:13px;'>Could not reach the database script.</p>";

        resetScanner(4000);
      };

      document.body.appendChild(script);
    }


    // ==========================================
    // INITIALISE SCANNER
    // ==========================================

    function initScanner() {

      stopAutoZoom();

      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 15,
          qrbox: {
            width: 250,
            height: 250
          },
          rememberLastUsedCamera: true,
          aspectRatio: 1.0,
          showZoomSliderIfSupported: true
        },
        false
      );

      html5QrcodeScanner.render(
        onScanSuccess,
        function(error) {
          // Ignore normal scanning errors.
        }
      );

      // Wait for camera video to become available.
      var cameraCheckAttempts = 0;

      var cameraCheck = setInterval(function() {

        cameraCheckAttempts++;

        var video = document.querySelector("#reader video");

        if (video && video.srcObject) {

          setCameraDisplayDirection();

          startAutoFocusAndZoom();

          clearInterval(cameraCheck);

        } else if (cameraCheckAttempts >= 40) {

          clearInterval(cameraCheck);

          console.log("Camera video was not detected.");
        }

      }, 300);
    }


    // ==========================================
    // RESET SCANNER AFTER EACH GUEST
    // ==========================================

    function resetScanner(delay) {

      // Stop previous automatic zoom before restarting.
      stopAutoZoom();

      setTimeout(function() {

        isProcessing = false;

        var resultDiv = document.getElementById("result");

        resultDiv.classList.remove("animate-entrance");
        resultDiv.style.display = "none";

        initScanner();

      }, delay);
    }


    // ==========================================
    // PAGE STARTUP
    // ==========================================

    window.onload = function() {

      initSlideshow();

      initScanner();

      populateVoiceList();

      // Unlock audio after the first user interaction.
      document.body.addEventListener(
        "click",
        unlockAudioEngine,
        { once: true }
      );

      document.body.addEventListener(
        "touchstart",
        unlockAudioEngine,
        { once: true }
      );
    };

  </script>

</body>
</html>
